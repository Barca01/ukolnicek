<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Úkolníček">
  <title>Úkolníček</title>
  <style>
    :root {
      --bg: #F6F7FB;
      --paper: #FFFFFF;
      --paper-2: #F3F5FB;
      --text: #23243A;
      --muted: #6B718A;
      --line: #E3E5EF;
      --indigo: #4A4FB8;
      --indigo-soft: rgba(74, 79, 184, 0.12);
      --grid: #DCE6F2;
      --black: #1B1B24;
      --gray: #7D8096;
      --gray-text: #4A4D63;
      --shadow: rgba(35, 36, 58, 0.08);
      --danger: #D96262;
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
      --safe-left: env(safe-area-inset-left);
      --safe-right: env(safe-area-inset-right);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Nunito", "Avenir Next", "Segoe UI", ui-rounded, system-ui, sans-serif;
      overscroll-behavior: none;
    }

    body {
      min-height: 100vh;
      padding-top: calc(var(--safe-top) + 8px);
      padding-bottom: calc(var(--safe-bottom) + 12px);
      padding-left: calc(var(--safe-left) + 12px);
      padding-right: calc(var(--safe-right) + 12px);
      overflow-x: hidden;
      touch-action: manipulation;
    }

    button, input {
      font: inherit;
    }

    button {
      border: none;
      background: none;
      color: inherit;
    }

    #app {
      width: min(100%, 420px);
      margin: 0 auto;
      min-height: calc(100vh - (var(--safe-top) + var(--safe-bottom) + 18px));
      position: relative;
    }

    .view {
      display: none;
      min-height: 100%;
    }

    .view.active {
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }

    .list-shell {
      display: flex;
      flex-direction: column;
      min-height: 100%;
      position: relative;
    }

    .list-header {
      position: relative;
      padding: 8px 4px 0;
      display: flex;
      justify-content: flex-end;
      z-index: 30;
    }

    .menu-button {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      font-size: 1.6rem;
      line-height: 1;
      background: transparent;
    }

    .menu-wrapper {
      position: relative;
    }

    .menu-panel {
      position: absolute;
      right: 0;
      top: 46px;
      background: rgba(255,255,255,0.97);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 10px 22px rgba(35, 36, 58, 0.12);
      min-width: 180px;
      overflow: hidden;
      z-index: 50;
    }

    .menu-panel.hidden,
    .modal.hidden,
    .reward-overlay.hidden {
      display: none;
    }

    .menu-item {
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      font-size: 0.98rem;
      color: var(--text);
      background: transparent;
    }

    .menu-item + .menu-item {
      border-top: 1px solid var(--line);
    }

    .date-switcher {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 8px 0 18px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.85);
      border: 1px solid rgba(227, 229, 239, 0.9);
      border-radius: 18px;
      box-shadow: 0 1px 6px rgba(35, 36, 58, 0.03);
      min-height: 58px;
    }

    .nav-button {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--indigo-soft);
      color: var(--indigo);
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1;
    }

    .date-label-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      flex: 1;
      text-align: center;
    }

    .date-label {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .today-button {
      padding: 6px 10px;
      border-radius: 10px;
      background: var(--indigo);
      color: white;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.01em;
      min-width: 64px;
    }

    .task-input-box {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .task-input {
      flex: 1;
      min-width: 0;
      height: 52px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,0.92);
      padding: 0 16px;
      font-size: 1.04rem;
      color: var(--text);
      outline: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
    }

    .task-input::placeholder {
      color: rgba(35, 36, 58, 0.42);
    }

    .add-button {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: var(--indigo);
      color: white;
      font-size: 1.9rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      box-shadow: 0 10px 18px rgba(74, 79, 184, 0.2);
    }

    .add-button.disabled {
      opacity: 0.45;
      box-shadow: none;
    }

    .task-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 100px;
      -webkit-overflow-scrolling: touch;
    }

    .task-item {
      background: rgba(255,255,255,0.93);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 10px 12px 10px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 58px;
      box-shadow: 0 2px 8px rgba(35, 36, 58, 0.02);
      touch-action: pan-y;
      user-select: none;
    }

    .task-item.dragging {
      opacity: 0.55;
    }

    .drag-handle {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(35, 36, 58, 0.5);
      font-size: 1rem;
      flex-shrink: 0;
    }

    .task-number {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--indigo-soft);
      color: var(--indigo);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    .task-item.completed .task-number {
      background: #EEF1F7;
      color: var(--gray);
    }

    .task-main {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      padding: 4px 0;
    }

    .task-text {
      display: block;
      width: 100%;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.25;
      word-break: break-word;
      color: var(--text);
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: var(--gray);
      opacity: 0.9;
    }

    .task-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      flex-shrink: 0;
    }

    .small-icon-btn {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: transparent;
      color: rgba(35, 36, 58, 0.6);
      font-size: 1.1rem;
      line-height: 1;
    }

    .move-day-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(74, 79, 184, 0.08);
      color: var(--indigo);
      position: relative;
      font-size: 1.1rem;
    }

    .task-delete-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(217, 98, 98, 0.08);
      color: var(--danger);
      font-size: 1.08rem;
      font-weight: 800;
      line-height: 1;
    }

    .task-move-up, .task-move-down {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      font-size: 1.15rem;
      font-weight: 800;
      color: rgba(35, 36, 58, 0.72);
      background: transparent;
    }

    .main-action-btn {
      width: 100%;
      height: 60px;
      border-radius: 18px;
      background: var(--indigo);
      color: white;
      font-weight: 800;
      font-size: 1.08rem;
      box-shadow: 0 10px 18px rgba(74, 79, 184, 0.2);
      margin-top: 6px;
      margin-bottom: 2px;
    }

    .main-action-btn:disabled {
      background: rgba(35, 36, 58, 0.12);
      color: rgba(35, 36, 58, 0.45);
      box-shadow: none;
    }

    .diagram-view {
      min-height: 100%;
      padding-top: 2px;
    }

    .diagram-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 0 12px;
      min-height: 46px;
    }

    .back-button {
      background: rgba(255,255,255,0.85);
      border: 1px solid var(--line);
      color: var(--indigo);
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 800;
      min-width: 124px;
    }

    .diagram-date {
      font-weight: 800;
      color: var(--text);
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }

    .diagram-progress {
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress-label {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 700;
      text-align: center;
    }

    .progress-bar {
      height: 8px;
      border-radius: 999px;
      background: rgba(74, 79, 184, 0.08);
      overflow: hidden;
      border: 1px solid rgba(74, 79, 184, 0.12);
    }

    .progress-bar span {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6D7BFF 0%, #4A4FB8 100%);
      border-radius: inherit;
      transition: width 0.3s ease;
    }

    .diagram-area {
      position: relative;
      flex: 1;
      min-height: 440px;
      background:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        #F8FAFD;
      background-size: 16px 16px, 16px 16px, 100% 100%;
      border-radius: 22px 22px 0 0;
      overflow: hidden;
      border: 1px solid rgba(220, 230, 242, 0.8);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
      padding: 16px 12px 22px;
    }

    .bubble-scene {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 420px;
    }

    .scene-connectors {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: visible;
    }

    .diagram-bubble {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      touch-action: manipulation;
      transition: transform 0.25s ease, opacity 0.25s ease;
      z-index: 2;
    }

    .diagram-bubble[data-role="done"] {
      filter: saturate(0.8);
    }

    .diagram-bubble[data-role="current"] {
      z-index: 4;
    }

    .diagram-bubble[data-role="next"] {
      z-index: 3;
    }

    .bubble-svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .bubble-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 22px;
      text-align: center;
      font-weight: 800;
      line-height: 1.2;
      color: var(--text);
      pointer-events: none;
      text-shadow: 0 1px 0 rgba(255,255,255,0.4);
    }

    .diagram-bubble[data-role="done"] .bubble-label {
      color: var(--gray-text);
    }

    .diagram-bubble[data-role="current"] .bubble-label {
      font-size: 1.06rem;
    }

    .diagram-bubble[data-role="next"] .bubble-label {
      font-size: 0.96rem;
    }

    .diagram-bubble[data-role="done"] .bubble-svg path:first-child {
      fill: rgba(255,255,255,0.75);
    }

    .diagram-hint {
      text-align: center;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 700;
      margin: 14px 0 0;
      min-height: 20px;
    }

    .reward-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.46);
      backdrop-filter: blur(1px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 80;
      pointer-events: none;
    }

    .reward-card {
      width: min(82vw, 300px);
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateY(-10px);
      animation: floatReward 2.8s ease-in-out infinite;
    }

    .reward-card svg {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 18px 20px rgba(35,36,58,0.12));
    }

    @keyframes floatReward {
      0%, 100% { transform: translateY(-10px); }
      50% { transform: translateY(-20px); }
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(18, 20, 32, 0.38);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 70;
      padding: 12px;
    }

    .modal-panel {
      background: rgba(255,255,255,0.98);
      border-radius: 24px 24px 0 0;
      width: min(100%, 420px);
      padding: 18px 16px calc(var(--safe-bottom) + 18px);
      box-shadow: 0 -12px 30px rgba(35, 36, 58, 0.18);
    }

    .editor-title {
      font-size: 1.2rem;
      font-weight: 900;
      margin-bottom: 14px;
      color: var(--text);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .field label {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--muted);
    }

    .field input {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0 14px;
      background: rgba(246,247,251,0.8);
      color: var(--text);
      font-size: 1rem;
    }

    .editor-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .editor-button {
      flex: 1;
      min-height: 48px;
      border-radius: 14px;
      font-weight: 800;
    }

    .editor-button.primary {
      background: var(--indigo);
      color: white;
    }

    .editor-button.secondary {
      background: rgba(74,79,184,0.08);
      color: var(--indigo);
    }

    .editor-button.danger {
      background: rgba(217,98,98,0.1);
      color: var(--danger);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <section id="listView" class="view active">
      <div class="list-shell">
        <div class="list-header">
          <div class="menu-wrapper">
            <button class="menu-button" id="menuButton" aria-label="Menu">⋯</button>
            <div id="menuPanel" class="menu-panel hidden" role="menu">
              <button class="menu-item" id="backupButton" role="menuitem">Zálohovat</button>
              <button class="menu-item" id="restoreButton" role="menuitem">Obnovit ze zálohy</button>
            </div>
          </div>
        </div>

        <div class="date-switcher">
          <button class="nav-button" id="prevDayBtn" aria-label="Předchozí den">‹</button>
          <div class="date-label-wrap">
            <div id="dateLabel" class="date-label">so 24. 10.</div>
            <button id="todayBtn" class="today-button">Dnes</button>
          </div>
          <button class="nav-button" id="nextDayBtn" aria-label="Další den">›</button>
        </div>

        <div class="task-input-box">
          <input id="taskInput" class="task-input" type="text" maxlength="220" placeholder="Přidat úkol…" aria-label="Přidat úkol">
          <button id="addTaskBtn" class="add-button" aria-label="Přidat úkol">＋</button>
        </div>

        <div id="taskList" class="task-list" aria-live="polite"></div>
        <button id="createDiagramBtn" class="main-action-btn" disabled>Vytvořit diagram</button>
      </div>
    </section>

    <section id="diagramView" class="view diagram-view">
      <div class="diagram-top">
        <button id="backToListBtn" class="back-button">Upravit seznam</button>
        <div id="diagramDate" class="diagram-date">so 24. 10.</div>
      </div>
      <div class="diagram-progress">
        <div id="progressLabel" class="progress-label">0 z 0 hotovo</div>
        <div class="progress-bar"><span id="progressFill"></span></div>
      </div>
      <div id="diagramArea" class="diagram-area" aria-live="polite"></div>
      <div class="diagram-hint">Dvojitým klepnutím na bublinu úkol splníš.</div>
    </section>
  </div>

  <div id="taskEditor" class="modal hidden" aria-hidden="true">
    <div class="modal-panel">
      <div class="editor-title">Úprava úkolu</div>
      <div class="field">
        <label for="editText">Úkol</label>
        <input id="editText" type="text" maxlength="220">
      </div>
      <div class="field">
        <label for="editShort">Krátký název pro diagram</label>
        <input id="editShort" type="text" maxlength="40" placeholder="Nepovinné">
      </div>
      <div class="editor-actions">
        <button id="deleteTaskBtn" class="editor-button danger">Smazat</button>
        <button id="cancelEditBtn" class="editor-button secondary">Zrušit</button>
        <button id="saveTaskBtn" class="editor-button primary">Uložit</button>
      </div>
    </div>
  </div>

  <div id="rewardOverlay" class="reward-overlay hidden" aria-live="polite"></div>
  <input id="nativeDatePicker" class="sr-only" type="date">

  <script>
    const STORAGE_KEY = 'ukolnicek-data-v1';
    const palette = ['#E8836B', '#4FB3A5', '#E3B04B', '#8E7CC3', '#5B9BD5'];

    const state = {
      tasks: [],
      activeDate: formatDateKey(new Date()),
      activeView: 'list',
      editingTaskId: null,
      pendingMoveTaskId: null,
      rewardTimeout: null
    };

    const els = {
      listView: document.getElementById('listView'),
      diagramView: document.getElementById('diagramView'),
      dateLabel: document.getElementById('dateLabel'),
      diagramDate: document.getElementById('diagramDate'),
      taskInput: document.getElementById('taskInput'),
      addTaskBtn: document.getElementById('addTaskBtn'),
      taskList: document.getElementById('taskList'),
      createDiagramBtn: document.getElementById('createDiagramBtn'),
      prevDayBtn: document.getElementById('prevDayBtn'),
      nextDayBtn: document.getElementById('nextDayBtn'),
      todayBtn: document.getElementById('todayBtn'),
      backToListBtn: document.getElementById('backToListBtn'),
      menuButton: document.getElementById('menuButton'),
      menuPanel: document.getElementById('menuPanel'),
      backupButton: document.getElementById('backupButton'),
      restoreButton: document.getElementById('restoreButton'),
      nativeDatePicker: document.getElementById('nativeDatePicker'),
      taskEditor: document.getElementById('taskEditor'),
      editText: document.getElementById('editText'),
      editShort: document.getElementById('editShort'),
      saveTaskBtn: document.getElementById('saveTaskBtn'),
      cancelEditBtn: document.getElementById('cancelEditBtn'),
      deleteTaskBtn: document.getElementById('deleteTaskBtn'),
      rewardOverlay: document.getElementById('rewardOverlay'),
      progressLabel: document.getElementById('progressLabel'),
      progressFill: document.getElementById('progressFill'),
      diagramArea: document.getElementById('diagramArea')
    };

    function formatDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function parseDateKey(value) {
      return new Date(value + 'T12:00:00');
    }

    function formatDayLabel(dateKey) {
      const date = parseDateKey(dateKey);
      const dayNames = ['ne', 'po', 'út', 'st', 'čt', 'pá', 'so'];
      const day = dayNames[date.getDay()];
      const d = date.getDate();
      const month = date.getMonth() + 1;
      return `${day} ${d}. ${month}.`;
    }

    function formatLongDate(dateKey) {
      const date = parseDateKey(dateKey);
      const formatter = new Intl.DateTimeFormat('cs-CZ', { weekday: 'short', day: 'numeric', month: 'numeric', hour12: false });
      return formatter.format(date).replace('.', '').replace(/\s+/g, ' ').trim();
    }

    function initState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        state.tasks = [];
        return;
      }
      try {
        const parsed = JSON.parse(raw);
        state.tasks = Array.isArray(parsed) ? parsed : (parsed.tasks || []);
      } catch (error) {
        state.tasks = [];
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.tasks));
    }

    function getTasksForDate(dateKey) {
      return state.tasks
        .filter(task => task.date === dateKey)
        .sort((a, b) => a.order - b.order);
    }

    function getNextOrder(dateKey) {
      const list = getTasksForDate(dateKey);
      return list.length ? Math.max(...list.map(task => task.order)) + 1 : 1;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function shortenText(value, maxLength = 28) {
      const text = String(value || '').trim();
      if (text.length <= maxLength) return text;
      const cut = text.slice(0, maxLength).trim();
      const lastSpace = cut.lastIndexOf(' ');
      let result = lastSpace > 0 ? cut.slice(0, lastSpace) : cut;
      if (result.length < text.length) result = result.trim();
      return `${result.replace(/[\s.]+$/, '')}…`;
    }

    function generateRandom(seed) {
      let value = seed % 2147483647;
      if (value <= 0) value += 2147483646;
      return function() {
        value = value * 16807 % 2147483647;
        return (value - 1) / 2147483646;
      };
    }

    function createTask(text, dateKey) {
      const trimmed = String(text || '').trim();
      if (!trimmed) return null;
      const item = {
        id: crypto.randomUUID ? crypto.randomUUID() : `task-${Date.now()}-${Math.random().toString(16).slice(2)}`,
        text: trimmed,
        shortTitle: '',
        date: dateKey,
        order: getNextOrder(dateKey),
        done: false,
        doneAt: null,
        color: palette[Math.floor(Math.random() * palette.length)],
        shapeSeed: Math.random() * 100000,
        hatchSeed: Math.random() * 100000,
        rewardShown: false
      };
      return item;
    }

    function addTaskFromInput() {
      const value = els.taskInput.value;
      const task = createTask(value, state.activeDate);
      if (!task) {
        els.taskInput.value = '';
        updateAddButtonState();
        return;
      }
      state.tasks.push(task);
      els.taskInput.value = '';
      saveState();
      renderList();
      const firstTask = document.querySelector('[data-task-id="' + task.id + '"]');
      if (firstTask) firstTask.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      els.taskInput.focus();
      updateAddButtonState();
    }

    function updateAddButtonState() {
      const empty = !String(els.taskInput.value).trim();
      els.addTaskBtn.classList.toggle('disabled', empty);
    }

    function moveTaskInOrder(taskId, direction) {
      const list = getTasksForDate(state.activeDate);
      const index = list.findIndex(task => task.id === taskId);
      if (index < 0) return;
      const targetIndex = direction === 'up' ? index - 1 : index + 1;
      if (targetIndex < 0 || targetIndex >= list.length) return;
      const arr = list;
      const item = arr[index];
      const other = arr[targetIndex];
      const tempOrder = item.order;
      item.order = other.order;
      other.order = tempOrder;
      saveState();
      renderList();
    }

    function setTaskDate(taskId, newDateKey) {
      const task = state.tasks.find(item => item.id === taskId);
      if (!task || !newDateKey) return;
      task.date = newDateKey;
      task.order = getNextOrder(newDateKey);
      saveState();
      renderList();
      renderDiagram();
    }

    function findTaskById(taskId) {
      return state.tasks.find(task => task.id === taskId) || null;
    }

    function showEditor(taskId) {
      const task = findTaskById(taskId);
      if (!task) return;
      state.editingTaskId = taskId;
      els.editText.value = task.text;
      els.editShort.value = task.shortTitle || '';
      els.taskEditor.classList.remove('hidden');
      els.taskEditor.setAttribute('aria-hidden', 'false');
      requestAnimationFrame(() => els.editText.focus());
    }

    function closeEditor() {
      state.editingTaskId = null;
      els.taskEditor.classList.add('hidden');
      els.taskEditor.setAttribute('aria-hidden', 'true');
    }

    function saveEditedTask() {
      const task = findTaskById(state.editingTaskId);
      if (!task) return;
      const nextText = String(els.editText.value || '').trim();
      if (!nextText) {
        return;
      }
      task.text = nextText;
      task.shortTitle = String(els.editShort.value || '').trim();
      closeEditor();
      saveState();
      renderList();
      renderDiagram();
    }

    function deleteTask() {
      const task = findTaskById(state.editingTaskId);
      if (!task) return;
      const ok = window.confirm('Smazat tento úkol?');
      if (!ok) return;
      state.tasks = state.tasks.filter(item => item.id !== task.id);
      closeEditor();
      saveState();
      renderList();
      renderDiagram();
    }

    function renderList() {
      els.dateLabel.textContent = formatDayLabel(state.activeDate);
      const tasks = getTasksForDate(state.activeDate);
      els.createDiagramBtn.disabled = tasks.length === 0;
      if (tasks.length === 0) {
        els.taskList.innerHTML = '';
        return;
      }

      els.taskList.innerHTML = tasks.map((task, index) => {
        const isCompleted = task.done;
        return `
          <div class="task-item ${isCompleted ? 'completed' : ''}" data-task-id="${task.id}" draggable="true">
            <div class="drag-handle" aria-label="Přesunout úkol">⋮⋮</div>
            <div class="task-number">${index + 1}</div>
            <div class="task-main task-open-editor" data-task-id="${task.id}">
              <span class="task-text">${escapeHtml(task.text)}</span>
            </div>
            <div class="task-actions">
              <button class="small-icon-btn task-move-up" data-task-id="${task.id}" aria-label="Posunout nahoru">↑</button>
              <button class="small-icon-btn task-move-down" data-task-id="${task.id}" aria-label="Posunout dolů">↓</button>
              <button class="move-day-btn" data-move-id="${task.id}" aria-label="Přesunout na jiný den">📅</button>
              <button class="task-delete-btn" data-delete-id="${task.id}" aria-label="Smazat úkol">✕</button>
            </div>
          </div>
        `;
      }).join('');

      els.taskList.querySelectorAll('.task-item').forEach(item => {
        item.addEventListener('dragstart', function(event) {
          event.dataTransfer.effectAllowed = 'move';
          event.dataTransfer.setData('text/plain', item.dataset.taskId);
          item.classList.add('dragging');
        });
        item.addEventListener('dragend', function() {
          item.classList.remove('dragging');
        });
        item.addEventListener('dragover', function(event) {
          event.preventDefault();
          event.dataTransfer.dropEffect = 'move';
        });
        item.addEventListener('drop', function(event) {
          event.preventDefault();
          const draggedId = event.dataTransfer.getData('text/plain');
          const targetId = item.dataset.taskId;
          if (!draggedId || draggedId === targetId) return;
          reorderTasksById(draggedId, targetId);
        });
      });
    }

    function reorderTasksById(draggedId, targetId) {
      const list = getTasksForDate(state.activeDate);
      const draggedIndex = list.findIndex(task => task.id === draggedId);
      const targetIndex = list.findIndex(task => task.id === targetId);
      if (draggedIndex < 0 || targetIndex < 0) return;
      const [moved] = list.splice(draggedIndex, 1);
      list.splice(targetIndex, 0, moved);
      list.forEach((task, index) => {
        const tasks = state.tasks.filter(item => item.date === state.activeDate && item.id === task.id);
        if (tasks.length) {
          tasks[0].order = index + 1;
        }
      });
      state.tasks = state.tasks.map(task => {
        const current = list.find(item => item.id === task.id);
        if (current && task.date === state.activeDate) {
          task.order = list.indexOf(current) + 1;
        }
        return task;
      });
      saveState();
      renderList();
    }

    function renderDiagram() {
      const tasks = getTasksForDate(state.activeDate);
      const doneCount = tasks.filter(t => t.done).length;
      const total = tasks.length;
      els.progressLabel.textContent = `${doneCount} z ${total} hotovo`;
      els.progressFill.style.width = total ? `${(doneCount / total) * 100}%` : '0%';
      els.diagramDate.textContent = formatDayLabel(state.activeDate);
      if (!total) {
        els.diagramArea.innerHTML = '';
        return;
      }

      const doneTasks = tasks.filter(task => task.done);
      const openTasks = tasks.filter(task => !task.done);
      const previous = doneTasks.length ? doneTasks[doneTasks.length - 1] : null;
      const current = openTasks.length ? openTasks[0] : (doneTasks.length ? doneTasks[doneTasks.length - 1] : null);
      const next = openTasks.length > 1 ? openTasks[1] : null;

      const list = [];
      if (previous && previous.id !== current?.id) list.push({ task: previous, role: 'done' });
      if (current) list.push({ task: current, role: 'current' });
      if (next && next.id !== current?.id) list.push({ task: next, role: 'next' });

      const connectors = renderSceneConnectors();
      const bubbles = list.map((entry, index) => renderBubble(entry.task, entry.role, index, list.length)).join('');
      els.diagramArea.innerHTML = `<div class="bubble-scene">${connectors}${bubbles}</div>`;

      els.diagramArea.querySelectorAll('.diagram-bubble').forEach(bubble => {
        const taskId = bubble.dataset.taskId;
        bubble.addEventListener('dblclick', () => toggleTaskDone(taskId));
        bubble.addEventListener('click', () => {
          bubble.style.transform = 'scale(0.98)';
          setTimeout(() => bubble.style.transform = '', 140);
        });
      });
    }

    function renderBubble(task, role, index, total) {
      const isDone = role === 'done';
      const config = {
        done: { width: 166, height: 122, left: 18, top: 26, stroke: '#7D8096', strokeWidth: 2.3, fontSize: '0.84rem' },
        current: { width: 190, height: 146, left: 188, top: 136, stroke: '#1B1B24', strokeWidth: 4, fontSize: '0.96rem' },
        next: { width: 168, height: 124, left: 36, top: 286, stroke: '#1B1B24', strokeWidth: 2.8, fontSize: '0.8rem' }
      };

      const spec = config[role] || config.current;
      const width = spec.width;
      const height = spec.height;
      const path = generateBubblePath(width, height, task.shapeSeed || 1, role);
      const textColor = isDone ? '#4A4D63' : '#23243A';
      const label = task.shortTitle && String(task.shortTitle).trim().length ? task.shortTitle : shortenText(task.text, role === 'current' ? 26 : 18);
      const style = `left:${spec.left}px; top:${spec.top}px; width:${width}px; height:${height}px;`;
      const svg = `
        <svg class="bubble-svg" viewBox="0 0 ${width} ${height}" aria-hidden="true">
          <path d="${path}" fill="rgba(255,255,255,0.96)" stroke="${spec.stroke}" stroke-width="${spec.strokeWidth}" stroke-linecap="round" stroke-linejoin="round" />
          ${isDone ? renderHatch(task, width, height) : ''}
        </svg>
      `;

      return `
        <div class="diagram-bubble" data-task-id="${task.id}" data-role="${role}" style="${style}">
          ${svg}
          <div class="bubble-label" style="color:${textColor}; font-size:${spec.fontSize};">${escapeHtml(label)}</div>
        </div>
      `;
    }

    function renderSceneConnectors() {
      return `
        <svg class="scene-connectors" viewBox="0 0 390 420" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <marker id="arrowDark" viewBox="0 0 12 12" refX="9.5" refY="6" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 0 L 12 6 L 0 12" fill="none" stroke="#1B1B24" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path>
            </marker>
          </defs>
          <path d="M 172 110 C 198 122, 210 138, 218 152" fill="none" stroke="#1B1B24" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrowDark)"/>
          <path d="M 248 268 C 228 287, 206 294, 174 300" fill="none" stroke="#1B1B24" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrowDark)"/>
        </svg>
      `;
    }

    function renderHatch(task, width, height) {
      const rand = generateRandom(Math.floor(task.hatchSeed || 1));
      const color = task.color || '#E8836B';
      const lines = [];
      const count = 7;
      for (let i = 0; i < count; i++) {
        const y = 18 + i * (height - 28) / count + rand() * 10;
        const startX = -8 + rand() * 10;
        const endX = width + 12 + rand() * 18;
        const endY = y + 12 + rand() * 18;
        const lineWidth = 2.8 + rand() * 1.0;
        const opacity = 0.72 + rand() * 0.18;
        lines.push(`<line x1="${startX}" y1="${y}" x2="${endX}" y2="${endY}" stroke="${color}" stroke-width="${lineWidth}" stroke-linecap="round" opacity="${opacity}" />`);
      }
      return `<g>${lines.join('')}</g>`;
    }

    function generateBubblePath(width, height, seed, role = 'current') {
      const sx = width / 220;
      const sy = height / 160;

      return [
        `M ${16 * sx} ${80 * sy}`,
        `C ${16 * sx} ${38 * sy}, ${44 * sx} ${18 * sy}, ${78 * sx} ${16 * sy}`,
        `C ${112 * sx} ${14 * sy}, ${150 * sx} ${18 * sy}, ${180 * sx} ${25 * sy}`,
        `C ${205 * sx} ${31 * sy}, ${205 * sx} ${56 * sy}, ${204 * sx} ${76 * sy}`,
        `C ${205 * sx} ${98 * sy}, ${192 * sx} ${122 * sy}, ${167 * sx} ${134 * sy}`,
        `C ${142 * sx} ${146 * sy}, ${103 * sx} ${147 * sy}, ${76 * sx} ${139 * sy}`,
        `C ${44 * sx} ${130 * sy}, ${18 * sx} ${108 * sy}, ${16 * sx} ${80 * sy} Z`
      ].join(' ');
    }

    function toggleTaskDone(taskId) {
      const task = findTaskById(taskId);
      if (!task) return;

      if (task.done) {
        task.done = false;
        task.doneAt = null;
        if (task.rewardShown) {
          showReward('sad');
          task.rewardShown = false;
        }
      } else {
        task.done = true;
        task.doneAt = new Date().toISOString();
        const allDone = getTasksForDate(state.activeDate).every(item => item.done);
        if (allDone) {
          showReward('happy');
          task.rewardShown = false;
        } else if (!task.rewardShown && Math.random() < 0.5) {
          showReward('cute');
          task.rewardShown = true;
        }
      }

      saveState();
      renderList();
      renderDiagram();
    }

    function showReward(type) {
      clearTimeout(state.rewardTimeout);
      const markup = type === 'cute'
        ? cuteCatSvg
        : type === 'sad'
          ? sadCatSvg
          : happyCatSvg;
      els.rewardOverlay.innerHTML = `<div class="reward-card">${markup}</div>`;
      els.rewardOverlay.classList.remove('hidden');
      state.rewardTimeout = setTimeout(() => {
        els.rewardOverlay.classList.add('hidden');
      }, 4000);
    }

    function goToDate(offset) {
      const date = parseDateKey(state.activeDate);
      date.setDate(date.getDate() + offset);
      state.activeDate = formatDateKey(date);
      renderList();
      renderDiagram();
    }

    function showList() {
      state.activeView = 'list';
      els.listView.classList.add('active');
      els.diagramView.classList.remove('active');
      renderList();
    }

    function showDiagram() {
      if (!getTasksForDate(state.activeDate).length) return;
      state.activeView = 'diagram';
      els.listView.classList.remove('active');
      els.diagramView.classList.add('active');
      renderDiagram();
    }

    function backupAllData() {
      const payload = JSON.stringify(state.tasks, null, 2);
      try {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(payload).catch(() => {});
        }
      } catch (error) {}
      window.prompt('Záloha dat (zkopírujte nebo uložte):', payload);
    }

    function restoreFromBackup() {
      const input = window.prompt('Vlož text zálohy JSON:', '');
      if (!input) return;
      try {
        const parsed = JSON.parse(input);
        const tasks = Array.isArray(parsed) ? parsed : parsed.tasks;
        if (!Array.isArray(tasks)) throw new Error('Neplatný formát');
        state.tasks = tasks;
        saveState();
        renderList();
        renderDiagram();
      } catch (error) {
        window.alert('Záloha se nepodařilo načíst.');
      }
    }

    function attachEvents() {
      els.taskInput.addEventListener('input', updateAddButtonState);
      els.taskInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          addTaskFromInput();
        }
      });
      els.addTaskBtn.addEventListener('click', addTaskFromInput);
      els.menuButton.addEventListener('click', () => {
        els.menuPanel.classList.toggle('hidden');
      });
      els.backupButton.addEventListener('click', backupAllData);
      els.restoreButton.addEventListener('click', restoreFromBackup);
      els.prevDayBtn.addEventListener('click', () => goToDate(-1));
      els.nextDayBtn.addEventListener('click', () => goToDate(1));
      els.todayBtn.addEventListener('click', () => {
        state.activeDate = formatDateKey(new Date());
        renderList();
        renderDiagram();
      });
      els.createDiagramBtn.addEventListener('click', showDiagram);
      els.backToListBtn.addEventListener('click', showList);

      document.addEventListener('click', (event) => {
        const moveBtn = event.target.closest('[data-move-id]');
        if (moveBtn) {
          state.pendingMoveTaskId = moveBtn.dataset.moveId;
          els.nativeDatePicker.value = '';
          els.nativeDatePicker.click();
          return;
        }

        const taskMoveUp = event.target.closest('.task-move-up');
        if (taskMoveUp) {
          moveTaskInOrder(taskMoveUp.dataset.taskId, 'up');
          return;
        }

        const taskMoveDown = event.target.closest('.task-move-down');
        if (taskMoveDown) {
          moveTaskInOrder(taskMoveDown.dataset.taskId, 'down');
          return;
        }

        const taskDelete = event.target.closest('.task-delete-btn');
        if (taskDelete) {
          const taskId = taskDelete.dataset.deleteId;
          const task = findTaskById(taskId);
          if (!task) return;
          const ok = window.confirm(`Smazat úkol "${task.text}"?`);
          if (!ok) return;
          state.tasks = state.tasks.filter(item => item.id !== taskId);
          saveState();
          renderList();
          renderDiagram();
          return;
        }

        const taskOpen = event.target.closest('.task-open-editor');
        if (taskOpen) {
          showEditor(taskOpen.dataset.taskId);
          return;
        }

        const bubble = event.target.closest('.diagram-bubble');
        if (bubble) {
          return;
        }

        if (!event.target.closest('.menu-panel') && !event.target.closest('#menuButton')) {
          els.menuPanel.classList.add('hidden');
        }
      });

      els.nativeDatePicker.addEventListener('change', () => {
        if (!state.pendingMoveTaskId) return;
        const selected = els.nativeDatePicker.value;
        if (selected) {
          setTaskDate(state.pendingMoveTaskId, selected);
        }
        state.pendingMoveTaskId = null;
      });

      els.saveTaskBtn.addEventListener('click', saveEditedTask);
      els.cancelEditBtn.addEventListener('click', closeEditor);
      els.deleteTaskBtn.addEventListener('click', deleteTask);
      els.taskEditor.addEventListener('click', (event) => {
        if (event.target === els.taskEditor) closeEditor();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !els.taskEditor.classList.contains('hidden')) {
          closeEditor();
        }
      });
    }
